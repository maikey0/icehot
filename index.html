<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ICE DUEL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap');

  :root{
    --bg: #06111f;
    --panel: #0d2138;
    --panel-2: #123153;
    --line: #3d6f9e;
    --host: #45f0d1;
    --guest: #ff7a59;
    --text: #eaf4ff;
    --text-dim: #7fa3c4;
    --danger: #ff4d6d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Rajdhani',sans-serif;
    overscroll-behavior:none; touch-action:none;
    overflow:hidden;
  }
  h1,h2,.display{font-family:'Oswald',sans-serif; letter-spacing:0.04em;}
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  .screen{flex:1; display:none; flex-direction:column; padding:24px 20px; overflow-y:auto;}
  .screen.active{display:flex;}

  .brand{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
  .brand .puck{width:14px; height:14px; border-radius:50%; background:var(--host); box-shadow:0 0 12px var(--host);}
  .brand h1{font-size:22px; margin:0; color:var(--text); text-transform:uppercase;}

  label{font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; display:block;}
  input[type=text]{
    width:100%; padding:14px 16px; font-size:18px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel); color:var(--text);
    font-family:'Rajdhani',sans-serif; font-weight:600; outline:none;
  }
  input[type=text]:focus{border-color:var(--host);}

  button{
    font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.03em;
    border:none; border-radius:10px; padding:14px 20px; font-size:16px;
    cursor:pointer; color:var(--bg); background:var(--host);
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{transform:scale(0.97);}
  button.secondary{background:transparent; color:var(--text); border:1px solid var(--line);}
  button.danger{background:var(--danger); color:#fff;}
  button:disabled{opacity:0.4; cursor:default;}

  .primary-cta{margin-top:18px; width:100%; padding:16px; font-size:18px;}

  .rating-badge{
    display:inline-flex; align-items:center; gap:6px; background:var(--panel-2);
    padding:4px 10px; border-radius:20px; font-size:13px; font-weight:700; color:var(--host);
  }

  .lobby-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .me{display:flex; flex-direction:column; gap:4px;}
  .me .name{font-size:20px; font-weight:700;}

  .player-list{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
  .player-card{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px;
  }
  .player-card .pname{font-size:17px; font-weight:700;}
  .player-card .prating{font-size:13px; color:var(--text-dim);}
  .player-card .invite-btn{padding:8px 14px; font-size:13px;}
  .empty-hint{color:var(--text-dim); font-size:14px; margin-top:20px; text-align:center; line-height:1.6;}

  .center-msg{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center;}
  .center-msg .big{font-size:22px; font-weight:700;}
  .spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--host); animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(3,10,18,0.85); display:none;
    align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .modal-overlay.active{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; width:100%; max-width:340px;}
  .modal h2{margin:0 0 6px; font-size:20px;}
  .modal p{color:var(--text-dim); margin:0 0 20px; font-size:14px;}
  .modal .row{display:flex; gap:10px;}
  .modal .row button{flex:1;}

  #screen-game{padding:0; position:relative; background:#000;}
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; background:linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
    pointer-events:none;
  }
  #hud .side{display:flex; flex-direction:column; align-items:flex-start; gap:2px; pointer-events:auto;}
  #hud .side.right{align-items:flex-end;}
  #hud .side .tag{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em;}
  #hud .side .score{font-size:30px; font-weight:700; font-family:'Oswald',sans-serif; line-height:1;}
  #hud .side.host .score{color:var(--host);}
  #hud .side.right .score{color:var(--guest);}
  #leaveBtn{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:5;
    padding:8px 16px; font-size:12px; background:rgba(20,30,45,0.75); color:var(--text-dim);
    border:1px solid var(--line);
  }
  canvas{display:block; width:100%; height:100%; touch-action:none;}

  #rotateOverlay{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px;
  }
  #rotateOverlay.active{display:flex;}
  #rotateOverlay .icon{font-size:44px;}

  .footer-note{color:var(--text-dim); font-size:12px; margin-top:auto; padding-top:24px; line-height:1.6;}
  .conn-status{font-size:12px; color:var(--text-dim); margin-bottom:14px;}
  .conn-status.err{color:var(--danger);}
</style>
</head>
<body>
<div id="app">

  <!-- NAME ENTRY -->
  <div class="screen active" id="screen-name">
    <div class="brand"><div class="puck"></div><h1>ICE DUEL</h1></div>
    <div class="conn-status" id="connStatus">サーバーに接続中…</div>
    <label>プレイヤー名</label>
    <input type="text" id="nameInput" placeholder="名前を入力" maxlength="12" autocomplete="off">
    <button class="primary-cta" id="enterLobbyBtn" disabled>ロビーへ</button>
    <p class="footer-note">同じ名前を使うと同一プレイヤーとしてレートが引き継がれます。名前が重複すると同一人物として扱われるので、他の人と被らない名前にしてください。</p>
  </div>

  <!-- LOBBY -->
  <div class="screen" id="screen-lobby">
    <div class="lobby-header">
      <div class="me">
        <span class="name" id="lobbyMyName"></span>
        <span class="rating-badge">RATE <span id="lobbyMyRating">1000</span></span>
      </div>
    </div>
    <label>オンライン中のプレイヤー</label>
    <div class="player-list" id="playerList"></div>
    <div class="empty-hint" id="emptyHint">対戦相手を探しています…<br>友達にもこのページを開いてもらい、名前を入力してもらいましょう。</div>
  </div>

  <!-- WAITING FOR OPPONENT TO ACCEPT -->
  <div class="screen" id="screen-waiting">
    <div class="center-msg">
      <div class="spinner"></div>
      <div class="big"><span id="waitingTarget"></span> に招待を送信中…</div>
      <div style="color:var(--text-dim); font-size:13px;">相手の応答を待っています</div>
      <button class="danger" id="cancelInviteBtn">キャンセル</button>
    </div>
  </div>

  <!-- MATCH RESULT -->
  <div class="screen" id="screen-result">
    <div class="center-msg">
      <div class="big" id="resultTitle" style="font-size:30px;"></div>
      <div id="resultScore" style="font-size:20px; color:var(--text-dim);"></div>
      <div class="rating-badge" id="resultRatingChange" style="font-size:15px; padding:8px 16px;"></div>
      <button class="primary-cta" id="backToLobbyBtn" style="max-width:260px;">ロビーへ戻る</button>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div id="hud">
      <div class="side host">
        <span class="tag" id="hostTag">HOST</span>
        <span class="score" id="scoreHost">0</span>
      </div>
      <div class="side right">
        <span class="tag" id="guestTag">GUEST</span>
        <span class="score" id="scoreGuest">0</span>
      </div>
    </div>
    <canvas id="rink"></canvas>
    <button id="leaveBtn">試合を放棄</button>
  </div>

</div>

<!-- INVITE RECEIVED MODAL -->
<div class="modal-overlay" id="inviteModal">
  <div class="modal">
    <h2 id="inviteFromName"></h2>
    <p>から対戦の招待が届きました。5本先取のオンライン対戦です。</p>
    <div class="row">
      <button class="secondary" id="declineBtn">断る</button>
      <button id="acceptBtn">受ける</button>
    </div>
  </div>
</div>

<div id="rotateOverlay">
  <div class="icon">📱</div>
  <div class="big" style="font-size:18px; font-weight:700;">端末を縦向きにしてください</div>
  <div style="color:var(--text-dim); font-size:13px;">ICE DUELは縦画面でプレイします</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, set, get, update, remove, onValue, off, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {
  getAuth, signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcKuqiJKjTNuLvNhXPMD86okL3FVGqVMM",
  authDomain: "icehotkeygame.firebaseapp.com",
  databaseURL: "https://icehotkeygame-default-rtdb.firebaseio.com",
  projectId: "icehotkeygame",
  storageBucket: "icehotkeygame.firebasestorage.app",
  messagingSenderId: "7333959062",
  appId: "1:7333959062:web:cbfc353edd3ff6c11a39b7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const authReady = signInAnonymously(auth)
  .then(()=>{
    document.getElementById('connStatus').textContent = '接続完了';
    document.getElementById('enterLobbyBtn').disabled = false;
  })
  .catch((e)=>{
    const el = document.getElementById('connStatus');
    el.textContent = 'サーバーに接続できませんでした(Firebaseの匿名認証が有効か確認してください)';
    el.classList.add('err');
    console.error(e);
  });

/* ============ db helpers ============ */
async function dGet(path){
  try{ const snap = await get(ref(db, path)); return snap.exists() ? snap.val() : null; }
  catch(e){ console.error('dGet', path, e); return null; }
}
async function dSet(path, value){
  try{ await set(ref(db, path), value); return true; }
  catch(e){ console.error('dSet', path, e); return false; }
}
async function dUpdate(path, obj){
  try{ await update(ref(db, path), obj); return true; }
  catch(e){ console.error('dUpdate', path, e); return false; }
}
async function dRemove(path){
  try{ await remove(ref(db, path)); }catch(e){ console.error('dRemove', path, e); }
}

const listeners = {};
function listenOn(key, path, cb){
  stopListen(key);
  const r = ref(db, path);
  onValue(r, (snap)=>cb(snap.exists() ? snap.val() : null));
  listeners[key] = r;
}
function stopListen(key){
  if(listeners[key]){ off(listeners[key]); delete listeners[key]; }
}
function stopAllListeners(){
  Object.keys(listeners).forEach(stopListen);
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function nowTs(){ return Date.now(); }
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
const timers = {};
function clearAllTimers(){
  Object.keys(timers).forEach(k=>{ clearInterval(timers[k]); delete timers[k]; });
}

/* ============ app state ============ */
let myName = '';
let myRating = 1000;
let currentMatchId = null;
let isHost = false;
let opponentName = '';
let lastRespondedInviteTs = 0;
let outInviteHandled = false;

/* ============ name entry ============ */
document.getElementById('enterLobbyBtn').addEventListener('click', async ()=>{
  await authReady;
  const val = document.getElementById('nameInput').value.trim();
  if(!val) return;
  myName = val.slice(0,12).replace(/[.#$\[\]\/]/g, '_');
  if(!myName) return;
  const existing = await dGet('players/'+myName);
  myRating = existing ? existing.rating : 1000;
  await heartbeat('lobby');
  onDisconnect(ref(db, 'players/'+myName)).remove();
  document.getElementById('lobbyMyName').textContent = myName;
  document.getElementById('lobbyMyRating').textContent = myRating;
  show('screen-lobby');
  startLobbyRealtime();
});

async function heartbeat(status){
  await dSet('players/'+myName, {name:myName, rating:myRating, lastSeen:nowTs(), status});
}

/* ============ lobby (realtime) ============ */
function startLobbyRealtime(){
  clearAllTimers();
  stopAllListeners();
  timers.hb = setInterval(()=>heartbeat('lobby'), 5000);
  listenOn('players', 'players', renderPlayerList);
  listenOn('myInvite', 'invites/'+myName, handleIncomingInvite);
}

function renderPlayerList(val){
  const cutoff = nowTs() - 15000;
  const list = Object.values(val || {}).filter(p=>p && p.name !== myName && p.lastSeen > cutoff && p.status === 'lobby');
  const listEl = document.getElementById('playerList');
  const emptyEl = document.getElementById('emptyHint');
  listEl.innerHTML = '';
  if(list.length === 0){
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    list.sort((a,b)=>b.rating-a.rating);
    list.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'player-card';
      card.innerHTML = `<div><div class="pname">${escapeHtml(p.name)}</div><div class="prating">RATE ${p.rating}</div></div><button class="invite-btn">招待</button>`;
      card.querySelector('button').addEventListener('click', ()=>sendInvite(p.name));
      listEl.appendChild(card);
    });
  }
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* sending an invite */
async function sendInvite(targetName){
  const matchId = uid();
  opponentName = targetName;
  currentMatchId = matchId;
  outInviteHandled = false;
  await dSet('invites/'+targetName, {from:myName, to:targetName, matchId, status:'pending', ts:nowTs()});
  document.getElementById('waitingTarget').textContent = targetName;
  show('screen-waiting');
  listenOn('outInvite', 'invites/'+targetName, async (inv)=>{
    if(!inv || inv.matchId !== matchId || outInviteHandled) return;
    if(inv.status === 'accepted'){
      outInviteHandled = true;
      stopAllListeners();
      clearAllTimers();
      isHost = true;
      await startMatch(matchId, myName, targetName);
    } else if(inv.status === 'declined'){
      outInviteHandled = true;
      await heartbeat('lobby');
      show('screen-lobby');
      startLobbyRealtime();
    }
  });
}

document.getElementById('cancelInviteBtn').addEventListener('click', async ()=>{
  outInviteHandled = true;
  if(opponentName) await dRemove('invites/'+opponentName);
  await heartbeat('lobby');
  show('screen-lobby');
  startLobbyRealtime();
});

/* receiving an invite while in lobby */
function handleIncomingInvite(inv){
  if(!inv || inv.status !== 'pending') return;
  if(inv.ts <= lastRespondedInviteTs) return;
  if(nowTs() - inv.ts > 20000) return;
  document.getElementById('inviteFromName').textContent = inv.from + ' さん';
  document.getElementById('inviteModal').classList.add('active');
  document.getElementById('acceptBtn').onclick = async ()=>{
    document.getElementById('inviteModal').classList.remove('active');
    lastRespondedInviteTs = inv.ts;
    await dUpdate('invites/'+myName, {status:'accepted'});
    stopAllListeners();
    clearAllTimers();
    isHost = false;
    opponentName = inv.from;
    await startMatch(inv.matchId, inv.from, myName);
  };
  document.getElementById('declineBtn').onclick = async ()=>{
    document.getElementById('inviteModal').classList.remove('active');
    lastRespondedInviteTs = inv.ts;
    await dUpdate('invites/'+myName, {status:'declined'});
  };
}

/* ============ match / game ============ */
const W = 400, H = 700;
const PUCK_R = 12, PADDLE_R = 28;
const GOAL_W = 130;
const WIN_SCORE = 5;
const COUNTDOWN_MS = 3000;
const GOAL_FREEZE_MS = 900;
const CELEBRATION_MS = 900;

let canvas, ctx, dpr, cssW, cssH, scaleF;
let canvasInitialized = false;
let iceGradient = null;
let myPaddle = {x:W/2, y: H-70};
let renderState = null;
let animFrame = null;

let countdownEndsAt = null;
let celebration = null;
let paddleGuestDisp = {x:W/2, y:70};
let dispPuck = {x:W/2, y:H/2};
let dispHostPaddle = {x:W/2, y:70};
let lastKnownScoreHost = -1, lastKnownScoreGuest = -1;
let guestEnding = false;
let guestPaddleCache = {x:W/2, y:70};

async function startMatch(matchId, hostName, guestName){
  currentMatchId = matchId;
  await heartbeat('in-match');
  document.getElementById('hostTag').textContent = hostName;
  document.getElementById('guestTag').textContent = guestName;
  myPaddle = isHost ? {x:W/2, y:H-70} : {x:W/2, y:70};

  paddleGuestDisp = {x:W/2, y:70};
  dispPuck = {x:W/2, y:H/2};
  dispHostPaddle = {x:W/2, y:70};
  celebration = null;
  lastKnownScoreHost = -1; lastKnownScoreGuest = -1;
  guestEnding = false;
  guestPaddleCache = {x:W/2, y:70};

  if(isHost){
    countdownEndsAt = nowTs() + COUNTDOWN_MS;
    const gp = await dGet('players/'+guestName);
    const guestRating = gp ? gp.rating : 1000;
    await dSet('matches/'+matchId, {
      status:'countdown', scoreHost:0, scoreGuest:0,
      puck:{x:W/2, y:H/2, vx:0, vy:0},
      paddleHost:{x:W/2, y:H-70}, paddleGuest:{x:W/2, y:70},
      hostName, guestName, hostRating: myRating, guestRating, winner:null,
      countdownEndsAt, updatedAt:nowTs()
    });
    await dRemove('invites/'+guestName);
  }

  setupCanvas();
  show('screen-game');
  clearAllTimers();

  if(isHost){
    listenOn('guestPaddle', 'guestPaddles/'+matchId, (gp)=>{ if(gp) guestPaddleCache = gp; });
    runHostLoop();
    timers.broadcast = setInterval(broadcastHostState, 80);
  } else {
    listenOn('matchState', 'matches/'+matchId, onGuestMatchState);
    timers.guestSend = setInterval(sendGuestPaddle, 80);
    runGuestRenderLoop();
  }
}

function setupCanvas(){
  canvas = document.getElementById('rink');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  iceGradient = ctx.createLinearGradient(0,0,0,H);
  iceGradient.addColorStop(0, '#0b2540');
  iceGradient.addColorStop(1, '#123a63');
  if(!canvasInitialized){
    canvasInitialized = true;
    window.addEventListener('resize', ()=>{ resizeCanvas(); checkOrientation(); });
    attachPointerHandlers();
    checkOrientation();
  }
}

function checkOrientation(){
  const overlay = document.getElementById('rotateOverlay');
  if(window.innerWidth > window.innerHeight){
    overlay.classList.add('active');
  } else {
    overlay.classList.remove('active');
  }
}

function resizeCanvas(){
  const vw = window.innerWidth, vh = window.innerHeight;
  cssH = vh;
  cssW = Math.min(vw, vh * (W/H));
  dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssW+'px';
  canvas.style.height = cssH+'px';
  canvas.width = Math.round(cssW*dpr);
  canvas.height = Math.round(cssH*dpr);
  scaleF = cssW / W;
  ctx.setTransform(dpr*scaleF, 0, 0, dpr*scaleF, 0, 0);
}

function attachPointerHandlers(){
  let dragging = false;
  const rect = ()=>canvas.getBoundingClientRect();
  function toLogical(clientX, clientY){
    const r = rect();
    let lx = (clientX - r.left) / scaleF;
    let ly = (clientY - r.top) / scaleF;
    if(!isHost){ lx = W - lx; ly = H - ly; }
    return {x:lx, y:ly};
  }
  function clampMine(p){
    p.x = Math.max(PADDLE_R, Math.min(W-PADDLE_R, p.x));
    if(isHost){
      p.y = Math.max(H/2 + PADDLE_R, Math.min(H-PADDLE_R, p.y));
    } else {
      p.y = Math.max(PADDLE_R, Math.min(H/2 - PADDLE_R, p.y));
    }
    return p;
  }
  function onDown(e){ dragging = true; onMove(e); }
  function onMove(e){
    if(!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    myPaddle = clampMine(toLogical(t.clientX, t.clientY));
  }
  function onUp(){ dragging = false; }
  canvas.addEventListener('touchstart', e=>{e.preventDefault(); onDown(e);}, {passive:false});
  canvas.addEventListener('touchmove', e=>{e.preventDefault(); onMove(e);}, {passive:false});
  canvas.addEventListener('touchend', e=>{e.preventDefault(); onUp();}, {passive:false});
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

/* ---- HOST authoritative physics ---- */
let hostState = null;
function runHostLoop(){
  hostState = {
    phase: 'countdown',
    scoreHost:0, scoreGuest:0,
    puck:{x:W/2, y:H/2, vx:0, vy:0},
    paddleHost: myPaddle,
    paddleGuest: {x:W/2, y:70},
    pausedUntil:null, pendingVel:null, winner:null, finishTriggered:false
  };
  let lastT = performance.now();
  function tick(t){
    const dt = Math.min(32, t-lastT)/16.67;
    lastT = t;
    stepPhysics(dt);
    renderFrame(hostState.puck, myPaddle, paddleGuestDisp, false, hostState.phase, countdownEndsAt);
    animFrame = requestAnimationFrame(tick);
  }
  animFrame = requestAnimationFrame(tick);
}

function stepPhysics(dt){
  const s = hostState;
  const now = nowTs();

  s.paddleHost = myPaddle;
  paddleGuestDisp.x += (guestPaddleCache.x-paddleGuestDisp.x)*0.3;
  paddleGuestDisp.y += (guestPaddleCache.y-paddleGuestDisp.y)*0.3;
  s.paddleGuest = paddleGuestDisp;

  if(s.phase === 'countdown'){
    if(now >= countdownEndsAt){
      s.phase = 'playing';
      s.puck.vx = (Math.random()<0.5?-1:1)*2.4;
      s.puck.vy = (Math.random()<0.5?-1:1)*2.4;
    }
    return;
  }

  if(s.phase === 'ending' || s.phase === 'ended'){
    return;
  }

  if(s.pausedUntil){
    if(now < s.pausedUntil) return;
    s.puck.vx = s.pendingVel.vx; s.puck.vy = s.pendingVel.vy;
    s.pausedUntil = null; s.pendingVel = null;
  }

  const p = s.puck;
  p.x += p.vx*dt; p.y += p.vy*dt;
  p.vx *= 0.996; p.vy *= 0.996;

  if(p.x - PUCK_R < 0){ p.x = PUCK_R; p.vx *= -1; }
  if(p.x + PUCK_R > W){ p.x = W-PUCK_R; p.vx *= -1; }

  const goalLeft = W/2 - GOAL_W/2, goalRight = W/2 + GOAL_W/2;

  if(p.y - PUCK_R < 0){
    if(p.x > goalLeft && p.x < goalRight){
      s.scoreHost++;
      celebration = {scorer:'host', start: nowTs()};
      if(s.scoreHost >= WIN_SCORE){
        s.phase = 'ending';
        s.winner = 'host';
        setTimeout(()=>finishMatch(s), 1000);
      } else {
        resetPuck(s, 'guest');
      }
    } else {
      p.y = PUCK_R; p.vy *= -1;
    }
  }
  if(p.y + PUCK_R > H){
    if(p.x > goalLeft && p.x < goalRight){
      s.scoreGuest++;
      celebration = {scorer:'guest', start: nowTs()};
      if(s.scoreGuest >= WIN_SCORE){
        s.phase = 'ending';
        s.winner = 'guest';
        setTimeout(()=>finishMatch(s), 1000);
      } else {
        resetPuck(s, 'host');
      }
    } else {
      p.y = H-PUCK_R; p.vy *= -1;
    }
  }

  collide(p, s.paddleHost);
  collide(p, s.paddleGuest);

  const speed = Math.hypot(p.vx,p.vy);
  if(speed > 14){ p.vx *= 14/speed; p.vy *= 14/speed; }
}

function resetPuck(s, concededSide){
  const margin = PUCK_R + 34;
  if(concededSide === 'guest'){
    s.puck.x = margin; s.puck.y = H*0.25;
    s.pendingVel = {vx: 3.0, vy: 1.6+Math.random()*1.0};
  } else {
    s.puck.x = margin; s.puck.y = H*0.75;
    s.pendingVel = {vx: 3.0, vy: -(1.6+Math.random()*1.0)};
  }
  s.puck.vx = 0; s.puck.vy = 0;
  s.pausedUntil = nowTs() + GOAL_FREEZE_MS;
}

function collide(p, paddle){
  const dx = p.x - paddle.x, dy = p.y - paddle.y;
  const dist = Math.hypot(dx,dy);
  const minDist = PUCK_R + PADDLE_R;
  if(dist < minDist && dist > 0){
    const nx = dx/dist, ny = dy/dist;
    p.x = paddle.x + nx*minDist;
    p.y = paddle.y + ny*minDist;
    const speed = Math.max(Math.hypot(p.vx,p.vy), 4);
    p.vx = nx*speed*1.15;
    p.vy = ny*speed*1.15;
  }
}

async function broadcastHostState(){
  if(!hostState) return;
  await dSet('matches/'+currentMatchId, {
    status: hostState.phase,
    scoreHost: hostState.scoreHost, scoreGuest: hostState.scoreGuest,
    puck: hostState.puck,
    paddleHost: hostState.paddleHost, paddleGuest: hostState.paddleGuest,
    winner: hostState.winner || null,
    countdownEndsAt,
    updatedAt: nowTs()
  });
  updateHud(hostState.scoreHost, hostState.scoreGuest);
}

async function finishMatch(s){
  s.phase = 'ended';
  clearInterval(timers.broadcast);
  const hostName = document.getElementById('hostTag').textContent;
  const guestName = document.getElementById('guestTag').textContent;
  const hp = await dGet('players/'+hostName);
  const gp2 = await dGet('players/'+guestName);
  const hostRating = hp ? hp.rating : 1000;
  const guestRating = gp2 ? gp2.rating : 1000;
  const hostWon = s.winner === 'host';
  const [newHost, newGuest] = eloUpdate(hostRating, guestRating, hostWon);
  if(hp) await dSet('players/'+hostName, {...hp, rating:newHost, status:'lobby', lastSeen:nowTs()});
  if(gp2) await dSet('players/'+guestName, {...gp2, rating:newGuest, status:'lobby', lastSeen:nowTs()});
  await dSet('matches/'+currentMatchId, {
    status:'ended', scoreHost:s.scoreHost, scoreGuest:s.scoreGuest,
    puck:s.puck, paddleHost:s.paddleHost, paddleGuest:s.paddleGuest,
    hostName, guestName, winner:s.winner, ratings:{hostRating:newHost, guestRating:newGuest}, updatedAt:nowTs()
  });
  myRating = newHost;
  showResult(s.winner==='host', s.scoreHost, s.scoreGuest, newHost-hostRating);
}

function eloUpdate(rHost, rGuest, hostWon){
  const K = 32;
  const expHost = 1/(1+Math.pow(10,(rGuest-rHost)/400));
  const sHost = hostWon?1:0;
  const newHost = Math.round(rHost + K*(sHost-expHost));
  const newGuest = Math.round(rGuest + K*((1-sHost)-(1-expHost)));
  return [newHost, newGuest];
}

/* ---- GUEST: receive state, send paddle ---- */
async function onGuestMatchState(m){
  if(!m) return;
  if(m.scoreHost > lastKnownScoreHost){
    celebration = {scorer:'host', start: nowTs()};
  } else if(m.scoreGuest > lastKnownScoreGuest){
    celebration = {scorer:'guest', start: nowTs()};
  }
  lastKnownScoreHost = m.scoreHost;
  lastKnownScoreGuest = m.scoreGuest;
  renderState = m;
  updateHud(m.scoreHost, m.scoreGuest);
  if(m.status === 'ended' && !guestEnding){
    guestEnding = true;
    setTimeout(async ()=>{
      const gp = await dGet('players/'+myName);
      myRating = gp ? gp.rating : myRating;
      showResult(m.winner==='guest', m.scoreHost, m.scoreGuest, null);
    }, 1000);
  }
}
async function sendGuestPaddle(){
  await dSet('guestPaddles/'+currentMatchId, {x:myPaddle.x, y:myPaddle.y, ts:nowTs()});
}
function runGuestRenderLoop(){
  function tick(){
    if(renderState){
      dispPuck.x += (renderState.puck.x-dispPuck.x)*0.3;
      dispPuck.y += (renderState.puck.y-dispPuck.y)*0.3;
      dispHostPaddle.x += (renderState.paddleHost.x-dispHostPaddle.x)*0.3;
      dispHostPaddle.y += (renderState.paddleHost.y-dispHostPaddle.y)*0.3;
      renderFrame(dispPuck, dispHostPaddle, myPaddle, true, renderState.status, renderState.countdownEndsAt);
    }
    animFrame = requestAnimationFrame(tick);
  }
  animFrame = requestAnimationFrame(tick);
}

/* ---- rendering ---- */
function renderFrame(puckPos, hostPos, guestPos, flip, status, cdEndsAt){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = iceGradient;
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 3;
  ctx.strokeRect(6,6,W-12,H-12);
  ctx.beginPath();
  ctx.moveTo(6,H/2); ctx.lineTo(W-6,H/2); ctx.stroke();
  ctx.beginPath();
  ctx.arc(W/2,H/2,50,0,Math.PI*2); ctx.stroke();

  const goalLeft = W/2 - GOAL_W/2, goalRight = W/2 + GOAL_W/2;
  ctx.strokeStyle = 'rgba(69,240,209,0.9)';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(goalLeft, 8); ctx.lineTo(goalRight, 8); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,122,89,0.9)';
  ctx.beginPath(); ctx.moveTo(goalLeft, H-8); ctx.lineTo(goalRight, H-8); ctx.stroke();

  function pt(x,y){ return flip ? {x:W-x, y:H-y} : {x,y}; }

  const puckP = pt(puckPos.x, puckPos.y);
  const hostP = pt(hostPos.x, hostPos.y);
  const guestP = pt(guestPos.x, guestPos.y);

  drawPaddle(hostP, '#45f0d1');
  drawPaddle(guestP, '#ff7a59');
  drawPuck(puckP);

  drawCelebration();
  drawCountdown(status, cdEndsAt);
}

function drawPaddle(p, color){
  ctx.beginPath();
  ctx.arc(p.x, p.y, PADDLE_R, 0, Math.PI*2);
  ctx.fillStyle = color+'33';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(p.x, p.y, 6, 0, Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();
}
function drawPuck(p){
  ctx.beginPath();
  ctx.arc(p.x, p.y, PUCK_R, 0, Math.PI*2);
  ctx.fillStyle = '#0a0a0a';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
}

function drawCountdown(status, cdEndsAt){
  if(status !== 'countdown' || !cdEndsAt) return;
  const remain = cdEndsAt - nowTs();
  if(remain <= 0) return;
  const n = Math.ceil(remain/1000);
  const frac = (remain % 1000)/1000;
  const scale = 0.7 + 0.3*(1-frac);
  ctx.save();
  ctx.fillStyle = 'rgba(4,12,22,0.35)';
  ctx.fillRect(0,0,W,H);
  ctx.translate(W/2, H/2);
  ctx.scale(scale, scale);
  ctx.font = "bold 90px Oswald, sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#45f0d1'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#eaf4ff';
  ctx.fillText(String(n), 0, 0);
  ctx.restore();
}

function drawCelebration(){
  if(!celebration) return;
  const elapsed = nowTs() - celebration.start;
  if(elapsed > CELEBRATION_MS){ celebration = null; return; }
  const t = elapsed / CELEBRATION_MS;
  const color = celebration.scorer === 'host' ? '#45f0d1' : '#ff7a59';
  const goalY = celebration.scorer === 'host' ? 8 : H-8;

  ctx.save();
  ctx.globalAlpha = Math.max(0, 1-t*1.2);
  const grad = ctx.createRadialGradient(W/2, goalY, 0, W/2, goalY, 150);
  grad.addColorStop(0, color+'99');
  grad.addColorStop(1, color+'00');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(W/2, goalY, 150, 0, Math.PI*2); ctx.fill();
  for(let i=0;i<8;i++){
    const angle = i*(Math.PI*2/8) + t*1.2;
    const pr = t*75;
    const px = W/2 + Math.cos(angle)*pr;
    const py = goalY + Math.sin(angle)*pr*0.7;
    ctx.globalAlpha = Math.max(0, 1-t);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(px, py, 4*(1-t*0.4), 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  const appear = Math.min(1, elapsed/150);
  const fadeStart = 600;
  const alpha = elapsed < fadeStart ? 1 : Math.max(0, 1-(elapsed-fadeStart)/300);
  ctx.globalAlpha = alpha;
  ctx.translate(W/2, H/2 - 30);
  ctx.scale(0.6+0.4*appear, 0.6+0.4*appear);
  ctx.font = "bold 48px Oswald, sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = 22;
  ctx.fillStyle = color;
  ctx.fillText('GOAL', 0, 0);
  ctx.restore();
}

function updateHud(sh, sg){
  document.getElementById('scoreHost').textContent = sh;
  document.getElementById('scoreGuest').textContent = sg;
}

/* ---- result / cleanup ---- */
function showResult(iWon, sh, sg, ratingDelta){
  clearAllTimers();
  stopAllListeners();
  if(animFrame) cancelAnimationFrame(animFrame);
  document.getElementById('resultTitle').textContent = iWon ? '勝利！' : '敗北…';
  document.getElementById('resultTitle').style.color = iWon ? '#45f0d1' : '#ff7a59';
  document.getElementById('resultScore').textContent = `${sh} - ${sg}`;
  const rc = document.getElementById('resultRatingChange');
  if(ratingDelta !== null && ratingDelta !== undefined){
    rc.textContent = `RATE ${myRating} (${ratingDelta>=0?'+':''}${ratingDelta})`;
  } else {
    rc.textContent = `RATE ${myRating}`;
  }
  show('screen-result');
  heartbeat('lobby');
}

document.getElementById('backToLobbyBtn').addEventListener('click', async ()=>{
  await heartbeat('lobby');
  show('screen-lobby');
  startLobbyRealtime();
});

document.getElementById('leaveBtn').addEventListener('click', async ()=>{
  clearAllTimers();
  stopAllListeners();
  if(animFrame) cancelAnimationFrame(animFrame);
  if(currentMatchId && isHost){
    const m = await dGet('matches/'+currentMatchId);
    if(m && m.status !== 'ended'){
      const guestName = document.getElementById('guestTag').textContent;
      const gp = await dGet('players/'+guestName);
      await dSet('matches/'+currentMatchId, {...m, status:'ended', winner:'guest', ratings:{hostRating:myRating, guestRating: gp ? gp.rating : 1000}});
    }
  }
  await heartbeat('lobby');
  show('screen-lobby');
  startLobbyRealtime();
});

window.addEventListener('beforeunload', ()=>{
  if(myName) dRemove('players/'+myName);
});
</script>
